<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263f35"><meta name="description" content="A private, offline-first family history notebook."><title>FamilyRoots</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--ink:#24342d;--muted:#69776f;--paper:#f7f6f0;--card:#fffef9;--green:#294b3d;--green2:#e2ede4;--gold:#c68d45;--line:#dfe4dc;--rose:#a94d43;--shadow:0 8px 24px #24342d0d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100dvh;padding-bottom:84px}.topbar{background:var(--green);color:#fff;padding:20px 18px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:11px;align-items:center}.brand-mark{width:43px;height:43px;border-radius:15px;background:#e6eddf;color:var(--green);display:grid;place-items:center;font-size:25px}.brand h1{font-size:21px;margin:0;letter-spacing:-.5px}.brand p{font-size:12px;margin:1px 0 0;color:#d8e5db}.top-actions{display:flex;gap:8px}.icon-btn{border:1px solid #ffffff55;background:#ffffff12;color:white;border-radius:12px;padding:9px 11px}.content{padding:18px 14px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:800;color:var(--muted)}h2{font-size:25px;letter-spacing:-.8px;line-height:1.15;margin:5px 0 7px}h3{font-size:17px;margin:0 0 10px}.sub{color:var(--muted);margin:0 0 18px;font-size:14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin:12px 0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:750;background:var(--green);color:white}.btn.secondary{background:var(--green2);color:var(--green)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:#f8e6e3;color:var(--rose)}.btn.small{padding:8px 10px;font-size:13px}.btn:disabled{opacity:.45}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.stat{background:var(--green2);border-radius:14px;padding:12px}.stat strong{display:block;font-size:23px;letter-spacing:-.8px}.stat span{font-size:11px;color:#50695a}.search{width:100%;padding:12px 13px;border:1px solid var(--line);background:white;border-radius:12px;margin:0 0 12px;outline-color:var(--gold)}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fffef9f2;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.tabs-inner{width:100%;max-width:650px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tab{border:0;background:transparent;color:var(--muted);padding:7px 4px;border-radius:12px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;flex-direction:column}.tab .ico{font-size:20px;line-height:1.1}.tab.active{background:var(--green2);color:var(--green)}.person-list{display:grid;gap:8px}.person-row{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid var(--line);border-radius:14px;background:#fffefb;text-align:left;width:100%;color:inherit}.avatar{flex:0 0 47px;width:47px;height:47px;border-radius:15px;background:#e8eee4;display:grid;place-items:center;font-size:22px;overflow:hidden;color:var(--green)}.avatar img,.portrait img{width:100%;height:100%;object-fit:cover}.person-row .name{font-weight:800}.person-row .meta{font-size:12px;color:var(--muted);margin-top:2px}.person-row .arrow{margin-left:auto;color:var(--muted);font-size:20px}.tree-intro{display:flex;justify-content:space-between;align-items:start;gap:10px}.tree-scroll{overflow-x:auto;padding:8px 2px 12px}.tree-node{display:flex;flex-direction:column;align-items:center;min-width:160px;max-width:210px;gap:6px}.tree-card{width:100%;background:white;border:1px solid var(--line);border-radius:15px;padding:12px;text-align:center;box-shadow:0 4px 13px #24342d0b;color:var(--ink)}.tree-card.selected{border:2px solid var(--gold);background:#fffaf0}.tree-card .avatar{margin:0 auto 7px}.tree-card .name{font-size:13px;font-weight:800}.tree-card .dates{font-size:11px;color:var(--muted)}.tree-row{display:flex;justify-content:center;align-items:stretch;gap:10px;min-width:max-content}.tree-connector{height:24px;width:2px;background:#b8c9b9;margin:auto}.tree-children{display:flex;justify-content:center;gap:12px;position:relative;padding-top:15px}.tree-children:before{content:"";position:absolute;top:0;left:calc(50% - 1px);height:15px;width:2px;background:#b8c9b9}.tree-child-wrap{position:relative;padding-top:0}.tree-child-wrap:before{content:"";position:absolute;top:-15px;left:50%;height:15px;width:2px;background:#b8c9b9}.tree-toggle{font-size:11px;color:var(--green);background:var(--green2);border:0;border-radius:20px;padding:5px 9px}.empty{padding:28px 12px;text-align:center;color:var(--muted)}.empty .big{font-size:36px;margin-bottom:8px}.profile-head{display:flex;gap:15px;align-items:center}.portrait{width:95px;height:95px;border-radius:24px;flex:0 0 95px;background:var(--green2);display:grid;place-items:center;font-size:40px;overflow:hidden}.profile-head h2{margin:0 0 5px;font-size:24px}.tag{display:inline-block;background:var(--green2);color:var(--green);padding:4px 8px;border-radius:20px;font-size:11px;font-weight:800;margin:3px 3px 0 0}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800}.detail-value{font-size:14px;margin-top:3px;overflow-wrap:anywhere}.timeline{border-left:2px solid #d6e2d5;margin:12px 0 5px 7px;padding-left:18px}.event{position:relative;padding:0 0 18px}.event:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--gold);left:-24px;top:5px;border:2px solid var(--card)}.event-date{font-size:11px;color:var(--muted);font-weight:800}.event-title{font-weight:800;margin:2px 0}.event-note{font-size:13px;color:var(--muted)}.family-link{display:flex;flex-wrap:wrap;gap:7px}.family-chip{border:1px solid var(--line);border-radius:20px;background:white;padding:7px 10px;font-size:12px;font-weight:700;color:var(--green)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#4d5d53}.field input,.field select,.field textarea{width:100%;border:1px solid #d8ded5;background:white;border-radius:11px;padding:11px;color:var(--ink);min-width:0}.field textarea{min-height:88px;resize:vertical}.field small{font-size:11px;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;z-index:10;background:#16251dc9;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{background:var(--paper);border-radius:22px 22px 16px 16px;width:100%;max-width:680px;max-height:92dvh;overflow:auto;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.modal-head h2{font-size:22px;margin:0}.close{border:0;border-radius:50%;width:38px;height:38px;background:#e8ece5;font-size:21px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:17px}.notice{font-size:12px;background:#f5efdf;padding:10px 12px;border-radius:12px;color:#6c5938;margin:10px 0}.hidden{display:none!important}.footer-note{font-size:11px;color:var(--muted);text-align:center;padding:16px 8px}.toast{position:fixed;z-index:20;bottom:94px;left:50%;transform:translateX(-50%);background:#243b30;color:white;padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:90%;text-align:center}.inline-actions{display:flex;gap:7px;flex-wrap:wrap}
@media(min-width:700px){.content{padding:25px}.modal-backdrop{align-items:center}.modal{border-radius:22px}.tree-card{padding:14px}.stats{gap:12px}.stat{padding:15px}}
</style></head>
<body><div class="app"><header class="topbar"><div class="brand"><div class="brand-mark">🌳</div><div><h1>FamilyRoots</h1><p>Your family's story, gathered in one place</p></div></div><div class="top-actions"><button class="icon-btn" id="backupBtn" aria-label="Backup and restore">↗</button></div></header><main class="content" id="main"></main><nav class="tabs"><div class="tabs-inner"><button class="tab active" data-tab="tree"><span class="ico">🌿</span>Family tree</button><button class="tab" data-tab="people"><span class="ico">👥</span>People</button><button class="tab" data-tab="profile"><span class="ico">📜</span>Profile</button></div></nav></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{'use strict';const KEY='familyroots-data-v1';let db,tab='tree',selected=null,expanded=new Set(),search='',modalPerson=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);const dateText=d=>d?esc(d):'Unknown';function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch{db=null}if(!db||!Array.isArray(db.people)){db={version:1,people:[],selected:null};save()}selected=db.selected||null}function save(){db.selected=selected;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Storage is full. Export a backup and remove some large photos.');}}function person(id){return db.people.find(p=>p.id===id)}function name(p){return p?[p.given,p.middle,p.surname].filter(Boolean).join(' ')||'Unnamed person':'Unknown'}function dates(p){return [p.birthDate,p.deathDate].filter(Boolean).join(' – ')||'Dates not recorded'}function relatives(p){return {father:person(p?.fatherId),mother:person(p?.motherId),spouses:(p?.spouseIds||[]).map(person).filter(Boolean),children:db.people.filter(x=>x.fatherId===p?.id||x.motherId===p?.id)}}function initials(p){return ((p?.given||'?')[0]+(p?.surname||'')[0]).toUpperCase()}function avatar(p,cls='avatar'){return `<div class="${cls}">${p?.photo?`<img src="${p.photo}" alt="Portrait of ${esc(name(p))}">`:p?`<span>${esc(initials(p))}</span>`:'🌱'}</div>`}function sortedPeople(list=db.people){return [...list].sort((a,b)=>name(a).localeCompare(name(b)))}function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600)}function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}function selectPerson(id,t='profile'){if(!person(id))return;selected=id;save();setTab(t)}function addPerson(p){db.people.push(p);selected=p.id;save();setTab('profile')}function personCard(p){return `<button class="person-row" data-open="${p.id}">${avatar(p)}<div style="min-width:0;text-align:left"><div class="name">${esc(name(p))}</div><div class="meta">${esc(dates(p))}${p.birthPlace?' · '+esc(p.birthPlace):''}</div></div><span class="arrow">›</span></button>`}function treeCard(p){return `<div class="tree-node"><button class="tree-card ${selected===p.id?'selected':''}" data-open="${p.id}">${avatar(p)}<div class="name">${esc(name(p))}</div><div class="dates">${esc(dates(p))}</div></button><button class="tree-toggle" data-expand="${p.id}">${expanded.has(p.id)?'− Hide children':'＋ Show children'}</button></div>`}function treeHtml(p,depth=0){if(!p)return '';let r=relatives(p),children=r.children;let html=`<div class="tree-node">${treeCard(p)}`;if(expanded.has(p.id)&&children.length&&depth<5){html+=`<div class="tree-connector"></div><div class="tree-children">${children.map(c=>`<div class="tree-child-wrap">${treeHtml(c,depth+1)}</div>`).join('')}</div>`}html+='</div>';return html}function renderTree(){const p=person(selected)||sortedPeople()[0];if(!p)return `<div class="panel empty"><div class="big">🌱</div><h3>Your family story starts here</h3><p>Add yourself or the earliest ancestor you know. You can connect relatives as you grow the tree.</p><button class="btn" data-add>＋ Add first person</button></div>`;selected=p.id;let r=relatives(p);let parentNodes=[r.father,r.mother].filter(Boolean);return `<div class="tree-intro"><div><div class="eyebrow">Explore your roots</div><h2>Family tree</h2><p class="sub">Choose a person, then grow their branches.</p></div><button class="btn" data-add>＋ Add</button></div><div class="stats"><div class="stat"><strong>${db.people.length}</strong><span>People recorded</span></div><div class="stat"><strong>${db.people.filter(x=>x.birthDate).length}</strong><span>Birth dates</span></div><div class="stat"><strong>${db.people.filter(x=>x.events?.length).length}</strong><span>Life stories started</span></div></div><div class="panel"><div class="section-head"><h3>Tree explorer</h3><button class="btn ghost small" id="collapseTree">Collapse branches</button></div><p class="sub">Currently centered on <strong>${esc(name(p))}</strong>. Tap a card to open its profile.</p><div class="tree-scroll"><div style="min-width:max-content;display:flex;flex-direction:column;align-items:center;gap:0">${parentNodes.length?`<div class="tree-row">${parentNodes.map(x=>treeCard(x)).join('')}</div><div class="tree-connector"></div>`:''}${treeHtml(p)}</div></div><div class="notice">This first version shows the selected person and expandable descendants. Use each profile to connect parents and spouses.</div></div><div class="panel"><h3>Quick family links</h3><div class="family-link">${[r.father,r.mother,...r.spouses,...r.children].filter(Boolean).length?[r.father,r.mother,...r.spouses,...r.children].filter(Boolean).map(x=>`<button class="family-chip" data-open="${x.id}">${esc(name(x))}</button>`).join(''):'<span class="sub">No relatives linked yet. Add parents or children from a profile.</span>'}</div><div class="inline-actions" style="margin-top:14px"><button class="btn secondary small" data-edit="${p.id}">Edit selected person</button><button class="btn ghost small" data-tabgo="people">Browse everyone</button></div></div>`}function renderPeople(){let list=sortedPeople(db.people.filter(p=>[name(p),p.altNames,p.birthPlace,p.deathPlace,p.notes].join(' ').toLowerCase().includes(search.toLowerCase())));return `<div class="eyebrow">Your growing archive</div><h2>People</h2><p class="sub">Search your family and open any person's profile.</p><input class="search" id="peopleSearch" value="${esc(search)}" placeholder="Search names, places, notes…"><div class="section-head"><span class="eyebrow">${list.length} ${list.length===1?'person':'people'}</span><button class="btn" data-add>＋ Add person</button></div><div class="person-list">${list.length?list.map(personCard).join(''):`<div class="panel empty"><div class="big">🔎</div>No matching people found.</div>`}</div>`}function renderProfile(){let p=person(selected);if(!p)return `<div class="panel empty"><div class="big">📜</div><h3>No profile selected</h3><p>Add a person to begin building their story.</p><button class="btn" data-add>＋ Add person</button></div>`;let r=relatives(p);let events=[...(p.events||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));return `<div class="inline-actions" style="margin-bottom:12px"><button class="btn ghost small" data-tabgo="tree">‹ Back to tree</button><button class="btn" data-edit="${p.id}">Edit profile</button></div><div class="panel"><div class="profile-head">${avatar(p,'portrait')}<div><div class="eyebrow">Individual profile</div><h2>${esc(name(p))}</h2><div class="sub" style="margin:0">${esc(dates(p))}</div>${p.living?'<span class="tag">Living person</span>':''}${p.altNames?`<div class="detail-value" style="margin-top:6px">Also known as ${esc(p.altNames)}</div>`:''}</div></div><div class="detail-grid" style="margin-top:20px"><div><div class="detail-label">Born</div><div class="detail-value">${dateText(p.birthDate)}${p.birthPlace?' · '+esc(p.birthPlace):''}</div></div><div><div class="detail-label">Died</div><div class="detail-value">${dateText(p.deathDate)}${p.deathPlace?' · '+esc(p.deathPlace):''}</div></div></div>${p.bio?`<div style="margin-top:18px"><div class="detail-label">Biography</div><div class="detail-value" style="white-space:pre-wrap">${esc(p.bio)}</div></div>`:''}${p.notes?`<div style="margin-top:16px"><div class="detail-label">Research notes</div><div class="detail-value" style="white-space:pre-wrap">${esc(p.notes)}</div></div>`:''}</div><div class="panel"><div class="section-head"><h3>Family connections</h3><button class="btn secondary small" data-edit="${p.id}">Manage</button></div><div class="detail-label">Parents</div><div class="family-link" style="margin:7px 0 14px">${[r.father,r.mother].filter(Boolean).map(x=>`<button class="family-chip" data-open="${x.id}">${esc(name(x))}</button>`).join('')||'<span class="sub">Not recorded</span>'}</div><div class="detail-label">Spouse or partners</div><div class="family-link" style="margin:7px 0 14px">${r.spouses.map(x=>`<button class="family-chip" data-open="${x.id}">${esc(name(x))}</button>`).join('')||'<span class="sub">Not recorded</span>'}</div><div class="detail-label">Children</div><div class="family-link" style="margin-top:7px">${r.children.map(x=>`<button class="family-chip" data-open="${x.id}">${esc(name(x))}</button>`).join('')||'<span class="sub">Not recorded</span>'}</div><div style="margin-top:14px"><button class="btn ghost small" data-addchild="${p.id}">＋ Add child</button><button class="btn ghost small" data-addparent="${p.id}">＋ Add parent</button></div></div><div class="panel"><div class="section-head"><h3>Life timeline</h3><button class="btn secondary small" data-event="${p.id}">＋ Add event</button></div>${events.length?`<div class="timeline">${events.map(e=>`<div class="event"><div class="event-date">${esc(e.date||'Date unknown')}${e.place?' · '+esc(e.place):''}</div><div class="event-title">${esc(e.title||'Untitled event')}</div>${e.note?`<div class="event-note">${esc(e.note)}</div>`:''}<button class="btn ghost small" data-editevent="${p.id}" data-eventid="${e.id}" style="margin-top:7px">Edit event</button></div>`).join('')}</div>`:'<div class="empty" style="padding:18px"><div class="big">🕰️</div>No events yet. Add a birth, census, marriage, migration, military record, or any moment worth preserving.</div>'}</div><div class="panel"><div class="section-head"><h3>Profile actions</h3></div><div class="inline-actions"><button class="btn secondary small" data-addsibling="${p.id}">＋ Add relative</button><button class="btn ghost small" data-edit="${p.id}">Edit details</button><button class="btn danger small" data-delete="${p.id}">Delete person</button></div></div><div class="footer-note">FamilyRoots keeps this family data in this browser on this device. Export backups regularly.</div>`}function render(){const main=$('#main');main.innerHTML=tab==='tree'?renderTree():tab==='people'?renderPeople():renderProfile();bind()}function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-tabgo]').forEach(b=>b.onclick=()=>setTab(b.dataset.tabgo));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>selectPerson(b.dataset.open,'profile'));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openPersonForm());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openPersonForm(person(b.dataset.edit)));document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{expanded.has(b.dataset.expand)?expanded.delete(b.dataset.expand):expanded.add(b.dataset.expand);render()});document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>openEventForm(b.dataset.event));document.querySelectorAll('[data-editevent]').forEach(b=>b.onclick=()=>openEventForm(b.dataset.editevent,person(b.dataset.editevent).events.find(e=>e.id===b.dataset.eventid)));document.querySelectorAll('[data-addchild]').forEach(b=>b.onclick=()=>openPersonForm(null,{parentId:b.dataset.addchild}));document.querySelectorAll('[data-addparent]').forEach(b=>b.onclick=()=>openPersonForm(null,{childId:b.dataset.addparent}));document.querySelectorAll('[data-addsibling]').forEach(b=>b.onclick=()=>openPersonForm(null,{relatedId:b.dataset.addsibling}));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deletePerson(b.dataset.delete));const s=$('#peopleSearch');if(s)s.oninput=()=>{search=s.value;const pos=s.selectionStart;renderPeopleOnly();const n=$('#peopleSearch');n.focus();n.setSelectionRange(pos,pos);bind()};const c=$('#collapseTree');if(c)c.onclick=()=>{expanded.clear();render()}}function renderPeopleOnly(){const main=$('#main');main.innerHTML=renderPeople()}
function optionsFor(selectedId,excludeId){return `<option value="">Not set</option>`+sortedPeople(db.people.filter(x=>x.id!==excludeId)).map(x=>`<option value="${x.id}" ${x.id===selectedId?'selected':''}>${esc(name(x))}</option>`).join('')}function openPersonForm(existing=null,link={}){modalPerson=existing;let p=existing||{given:'',middle:'',surname:'',altNames:'',birthDate:'',birthPlace:'',deathDate:'',deathPlace:'',living:false,bio:'',notes:'',fatherId:'',motherId:'',spouseIds:[],photo:''};let title=existing?'Edit person':'Add a person';$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" id="closeModal">×</button></div><form id="personForm"><div class="form-grid"><div class="field"><label for="given">Given name *</label><input id="given" name="given" value="${esc(p.given)}" required></div><div class="field"><label for="surname">Surname</label><input id="surname" name="surname" value="${esc(p.surname)}"></div><div class="field"><label for="middle">Middle names</label><input id="middle" name="middle" value="${esc(p.middle)}"></div><div class="field"><label for="altNames">Maiden / alternate names</label><input id="altNames" name="altNames" value="${esc(p.altNames)}"></div><div class="field"><label for="birthDate">Birth date</label><input id="birthDate" name="birthDate" value="${esc(p.birthDate)}" placeholder="e.g. 1842 or about 1842"></div><div class="field"><label for="birthPlace">Birth place</label><input id="birthPlace" name="birthPlace" value="${esc(p.birthPlace)}"></div><div class="field"><label for="deathDate">Death date</label><input id="deathDate" name="deathDate" value="${esc(p.deathDate)}" placeholder="e.g. 1911 or before 1912"></div><div class="field"><label for="deathPlace">Death place</label><input id="deathPlace" name="deathPlace" value="${esc(p.deathPlace)}"></div><div class="field"><label for="fatherId">Father</label><select name="fatherId" id="fatherId">${optionsFor(p.fatherId,existing?.id)}</select></div><div class="field"><label for="motherId">Mother</label><select name="motherId" id="motherId">${optionsFor(p.motherId,existing?.id)}</select></div><div class="field full"><label for="spouseIds">Spouse / partner</label><select id="spouseIds" name="spouseIds" multiple size="3">${sortedPeople(db.people.filter(x=>x.id!==existing?.id)).map(x=>`<option value="${x.id}" ${(p.spouseIds||[]).includes(x.id)?'selected':''}>${esc(name(x))}</option>`).join('')}</select><small>On most phones, tap a selected name again to unselect it. Use multiple selection for more than one partner.</small></div><div class="field full"><label for="photo">Profile picture</label><input type="file" id="photo" accept="image/*"><small>Stored in this browser. Large images can use up local storage.</small>${p.photo?`<label><input type="checkbox" id="removePhoto"> Remove current picture</label>`:''}</div><div class="field full"><label for="bio">Biography</label><textarea id="bio" name="bio">${esc(p.bio)}</textarea></div><div class="field full"><label for="notes">Research notes</label><textarea id="notes" name="notes">${esc(p.notes)}</textarea></div><div class="field full"><label><input type="checkbox" name="living" ${p.living?'checked':''} style="width:auto"> Living person (mark as private in future exports)</label></div></div>${link.parentId?`<input type="hidden" name="linkParent" value="${link.parentId}">`:''}${link.childId?`<input type="hidden" name="linkChild" value="${link.childId}">`:''}${link.relatedId?`<input type="hidden" name="linkRelated" value="${link.relatedId}">`:''}<div class="modal-actions"><button type="button" class="btn ghost" id="cancelModal">Cancel</button><button class="btn" type="submit">Save person</button></div></form></section></div>`;$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};$('#personForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);let photo=p.photo||'';const file=$('#photo').files[0];if(file){if(file.size>1200000){toast('That picture is large. Choose one under 1.2 MB.');return}photo=await fileToData(file)}if($('#removePhoto')?.checked)photo='';let q={id:existing?.id||uid(),given:f.get('given').trim(),middle:f.get('middle').trim(),surname:f.get('surname').trim(),altNames:f.get('altNames').trim(),birthDate:f.get('birthDate').trim(),birthPlace:f.get('birthPlace').trim(),deathDate:f.get('deathDate').trim(),deathPlace:f.get('deathPlace').trim(),living:f.has('living'),bio:f.get('bio').trim(),notes:f.get('notes').trim(),fatherId:f.get('fatherId')||'',motherId:f.get('motherId')||'',spouseIds:Array.from($('#spouseIds').selectedOptions).map(o=>o.value),photo,events:p.events||[]};if(f.get('linkParent'))q.fatherId=f.get('linkParent');if(f.get('linkChild')){let child=person(f.get('linkChild'));if(child){if(!child.fatherId)child.fatherId=q.id;else if(!child.motherId)child.motherId=q.id;}}if(f.get('linkRelated')){let rel=person(f.get('linkRelated'));if(rel){q.fatherId=rel.fatherId;q.motherId=rel.motherId;}}if(existing){let idx=db.people.findIndex(x=>x.id===existing.id);db.people[idx]=q}else{db.people.push(q);if(f.get('linkParent')){let par=person(f.get('linkParent'));if(par){q.fatherId=par.id}}if(f.get('linkChild')){let child=person(f.get('linkChild'));if(child){if(!child.fatherId)child.fatherId=q.id;else if(!child.motherId)child.motherId=q.id;}}if(f.get('linkRelated')){let rel=person(f.get('linkRelated'));if(rel){q.fatherId=rel.fatherId;q.motherId=rel.motherId;}}}for(const sid of q.spouseIds){let sp=person(sid);if(sp){sp.spouseIds=Array.from(new Set([...(sp.spouseIds||[]),q.id]))}}if(existing){for(const old of db.people){if(old.id!==q.id&&(old.spouseIds||[]).includes(q.id)&&!q.spouseIds.includes(old.id))old.spouseIds=old.spouseIds.filter(x=>x!==q.id)}}selected=q.id;save();closeModal();setTab('profile');toast(existing?'Profile updated':'Person added to your tree')}}
function fileToData(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}function closeModal(){$('#modalRoot').innerHTML=''}function openEventForm(personId,event=null){let p=person(personId);if(!p)return;let e=event||{title:'',date:'',place:'',note:'',type:'Other'};$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal"><div class="modal-head"><h2>${event?'Edit timeline event':'Add timeline event'}</h2><button class="close" id="closeModal">×</button></div><form id="eventForm"><div class="form-grid"><div class="field full"><label for="eventTitle">Event title *</label><input id="eventTitle" name="title" value="${esc(e.title)}" placeholder="e.g. 1900 census" required></div><div class="field"><label for="eventDate">Date</label><input id="eventDate" name="date" value="${esc(e.date)}" placeholder="Exact, estimated, or uncertain"></div><div class="field"><label for="eventType">Event type</label><select name="type" id="eventType">${['Birth','Baptism','Census','Marriage','Military','Migration','Education','Employment','Property','Court','Death','Burial','Other'].map(t=>`<option ${e.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field full"><label for="eventPlace">Place</label><input id="eventPlace" name="place" value="${esc(e.place)}"></div><div class="field full"><label for="eventNote">Details / source notes</label><textarea id="eventNote" name="note">${esc(e.note)}</textarea></div></div><div class="modal-actions">${event?'<button type="button" class="btn danger" id="deleteEvent">Delete event</button>':''}<button type="button" class="btn ghost" id="cancelModal">Cancel</button><button class="btn" type="submit">Save event</button></div></form></section></div>`;$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};if(event)$('#deleteEvent').onclick=()=>{if(confirm('Delete this timeline event?')){p.events=p.events.filter(x=>x.id!==event.id);save();closeModal();render();toast('Event deleted')}};$('#eventForm').onsubmit=e2=>{e2.preventDefault();let f=new FormData(e2.target),q={id:event?.id||uid(),title:f.get('title').trim(),date:f.get('date').trim(),type:f.get('type'),place:f.get('place').trim(),note:f.get('note').trim()};p.events=p.events||[];if(event)p.events=p.events.map(x=>x.id===event.id?q:x);else p.events.push(q);save();closeModal();render();toast('Timeline updated')}}function deletePerson(id){let p=person(id);if(!p)return;if(!confirm(`Delete ${name(p)}? This cannot be undone unless you have a backup.`))return;db.people=db.people.filter(x=>x.id!==id);for(const x of db.people){if(x.fatherId===id)x.fatherId='';if(x.motherId===id)x.motherId='';x.spouseIds=(x.spouseIds||[]).filter(s=>s!==id)}selected=db.people[0]?.id||null;save();setTab(selected?'profile':'tree');toast('Person deleted')}function backupModal(){closeModal();$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal"><div class="modal-head"><h2>Backup & restore</h2><button class="close" id="closeModal">×</button></div><p class="sub">Your tree lives in this browser on this device. Export a backup before changing phones or clearing browser data.</p><div class="panel"><h3>Export your family</h3><p class="sub">Creates a JSON backup containing profiles, family links, timeline events, notes, and any profile photos.</p><button class="btn" id="exportBtn">↓ Export backup</button></div><div class="panel"><h3>Restore a backup</h3><p class="sub">Restoring replaces the family data currently stored in this browser.</p><input type="file" id="importFile" accept=".json,application/json"><div class="modal-actions"><button class="btn danger" id="importBtn">Restore backup</button></div></div><div class="notice">Privacy note: data stays on this device unless you export or share a backup. Anyone who can use this browser profile may be able to access it.</div></section></div>`;$('#closeModal').onclick=closeModal;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({app:'FamilyRoots',version:1,exportedAt:new Date().toISOString(),people:db.people,selected},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='familyroots-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')};$('#importBtn').onclick=()=>{let file=$('#importFile').files[0];if(!file){toast('Choose a backup file first');return}if(!confirm('Replace all current FamilyRoots data with this backup? Export your current data first if you want to keep it.'))return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!Array.isArray(data.people))throw Error('Invalid backup');if(!data.people.every(p=>p.id&&typeof p.given==='string'))throw Error('Invalid people data');db={version:1,people:data.people,selected:data.selected||data.people[0]?.id||null};selected=db.selected;save();closeModal();setTab(selected?'profile':'tree');toast('Backup restored')}catch(err){toast('Could not restore that file. Check that it is a FamilyRoots JSON backup.')}};r.readAsText(file)}}$('#backupBtn').onclick=backupModal;
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));load();render();})();
